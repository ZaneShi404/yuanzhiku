# 未知 Host 一律拒绝（加固计划 Task 2）：444 = 不回应直接断开，
# 防止 DNS rebinding 或扫描器经任意 Host 头触达 API。
server {
  listen 80 default_server;
  server_name _;
  return 444;
}

server {
  listen 80;
  server_name 127.0.0.1 localhost;
  root /usr/share/nginx/html;
  index index.html;
  location /api/ {
    proxy_pass http://api:8765;
    # Host 固定为回环地址：上游只信任本机访问边界，不透传外部 Host。
    proxy_set_header Host 127.0.0.1;
  }
  location /openapi.json {
    proxy_pass http://api:8765;
    proxy_set_header Host 127.0.0.1;
  }
  location / {
    try_files $uri $uri/ /index.html;
  }
}
