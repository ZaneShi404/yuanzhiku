services:
  api:
    image: yuanzhiku-application:local
    environment:
      YUANZHIKU_DATA_ROOT: /data
      YUANZHIKU_DATABASE_URL: postgresql+psycopg://yuanzhiku:yuanzhiku_local_only@postgres:5432/yuanzhiku
      YUANZHIKU_EMBEDDED_WORKER: "false"
    volumes:
      - ${YUANZHIKU_COMPOSE_DATA_ROOT:?Set to tests/runtime/compose-<run-id> for integration tests}:/data
    ports:
      - "127.0.0.1:8765:8765"
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_started
    restart: "no"
  worker:
    image: yuanzhiku-application:local
    environment:
      YUANZHIKU_DATA_ROOT: /data
      YUANZHIKU_DATABASE_URL: postgresql+psycopg://yuanzhiku:yuanzhiku_local_only@postgres:5432/yuanzhiku
      YUANZHIKU_EMBEDDED_WORKER: "false"
    volumes:
      - ${YUANZHIKU_COMPOSE_DATA_ROOT:?Set to tests/runtime/compose-<run-id> for integration tests}:/data
    command: ["python", "-m", "app.worker"]
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_started
    restart: "no"
  migrate:
    image: yuanzhiku-application:local
    build:
      context: .
      dockerfile: Dockerfile
      target: application
    environment:
      YUANZHIKU_DATABASE_URL: postgresql+psycopg://yuanzhiku:yuanzhiku_local_only@postgres:5432/yuanzhiku
    command: ["python", "-m", "app.migrate"]
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"
  web:
    build:
      context: .
      dockerfile: Dockerfile
      target: web
    ports:
      - "127.0.0.1:5173:80"
    depends_on:
      api:
        condition: service_started
    restart: "no"
  postgres:
    image: postgres:17.2-alpine
    environment:
      POSTGRES_DB: yuanzhiku
      POSTGRES_USER: yuanzhiku
      POSTGRES_PASSWORD: yuanzhiku_local_only
    volumes:
      - ${YUANZHIKU_COMPOSE_DATA_ROOT:?Set to tests/runtime/compose-<run-id> for integration tests}/postgres:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:54329:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U yuanzhiku -d yuanzhiku"]
      interval: 5s
      timeout: 5s
      retries: 12
    restart: "no"
  redis:
    image: redis:7.4.2-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    ports:
      - "127.0.0.1:56379:6379"
    restart: "no"
