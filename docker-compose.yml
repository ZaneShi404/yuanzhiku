services:
  api:
    image: yuanzhiku-application:local
    environment:
      YUANZHIKU_DATA_ROOT: /data
      # 应用角色（最小权限，由 grant 服务在迁移后授予）
      YUANZHIKU_DATABASE_URL: postgresql+psycopg://yuanzhiku_app:${YUANZHIKU_DB_APP_PASSWORD:?Set YUANZHIKU_DB_APP_PASSWORD}@postgres:5432/yuanzhiku
      YUANZHIKU_EMBEDDED_WORKER: "false"
    volumes:
      - ${YUANZHIKU_COMPOSE_DATA_ROOT:?Set to tests/runtime/compose-<run-id> for integration tests}:/data
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      grant:
        condition: service_completed_successfully
    restart: "no"
  worker:
    image: yuanzhiku-application:local
    environment:
      YUANZHIKU_DATA_ROOT: /data
      YUANZHIKU_DATABASE_URL: postgresql+psycopg://yuanzhiku_app:${YUANZHIKU_DB_APP_PASSWORD:?Set YUANZHIKU_DB_APP_PASSWORD}@postgres:5432/yuanzhiku
      YUANZHIKU_EMBEDDED_WORKER: "false"
    volumes:
      - ${YUANZHIKU_COMPOSE_DATA_ROOT:?Set to tests/runtime/compose-<run-id> for integration tests}:/data
    command: ["python", "-m", "app.worker"]
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      grant:
        condition: service_completed_successfully
    restart: "no"
  migrate:
    image: yuanzhiku-application:local
    build:
      context: .
      dockerfile: Dockerfile
      target: application
    environment:
      # 迁移使用管理员角色（唯一以 admin 连接的组件）
      YUANZHIKU_DATABASE_URL: postgresql+psycopg://yuanzhiku_admin:${YUANZHIKU_DB_ADMIN_PASSWORD:?Set YUANZHIKU_DB_ADMIN_PASSWORD}@postgres:5432/yuanzhiku
    command: ["python", "-m", "app.migrate"]
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"
  grant:
    image: yuanzhiku-application:local
    build:
      context: .
      dockerfile: Dockerfile
      target: application
    environment:
      YUANZHIKU_DB_ADMIN_URL: postgresql+psycopg://yuanzhiku_admin:${YUANZHIKU_DB_ADMIN_PASSWORD:?Set YUANZHIKU_DB_ADMIN_PASSWORD}@postgres:5432/yuanzhiku
      YUANZHIKU_DB_APP_USER: yuanzhiku_app
      YUANZHIKU_DB_APP_PASSWORD: ${YUANZHIKU_DB_APP_PASSWORD:?Set YUANZHIKU_DB_APP_PASSWORD}
    command: ["python", "scripts/grant-postgres-app-role.py"]
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: "no"
  web:
    build:
      context: .
      dockerfile: Dockerfile
      target: web
    ports:
      - "127.0.0.1:5173:80"
    depends_on:
      api:
        condition: service_started
    restart: "no"
  postgres:
    image: postgres:17.2-alpine
    environment:
      POSTGRES_DB: yuanzhiku
      POSTGRES_USER: yuanzhiku_admin
      POSTGRES_PASSWORD: ${YUANZHIKU_DB_ADMIN_PASSWORD:?Set YUANZHIKU_DB_ADMIN_PASSWORD}
    volumes:
      - ${YUANZHIKU_COMPOSE_DATA_ROOT:?Set to tests/runtime/compose-<run-id> for integration tests}/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U yuanzhiku_admin -d yuanzhiku"]
      interval: 5s
      timeout: 5s
      retries: 12
    restart: "no"
